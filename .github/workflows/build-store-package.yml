name: Build and publish Chrome Web Store package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Enviar e publicar na Chrome Web Store mesmo sem mudança de versão"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          previous=""
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            previous="$(git show HEAD~1:manifest.json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)"
          fi
          changed=false
          if [ "$current" != "$previous" ]; then changed=true; fi
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Versão atual: $current (anterior: ${previous:-n/a}) -> changed=$changed"

      - name: Validate store manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          permissions = set(manifest.get("permissions", []))

          assert manifest.get("manifest_version") == 3, "Chrome Web Store build must use Manifest V3"
          assert "nativeMessaging" not in permissions, "nativeMessaging must not be shipped in the store build"
          assert "alarms" not in permissions, "alarms are only used by the legacy updater"
          assert "background" not in manifest, "legacy updater background worker must not be shipped"
          assert manifest.get("icons", {}).get("128") == "icons/icon128.png", "128px store icon is missing"
          PY

      - name: Build Chrome Web Store ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          ROOT="$PWD"
          STAGE="$ROOT/dist/store-package"
          ZIP="$ROOT/dist/gired-fixer-${VERSION}-chrome-web-store.zip"

          rm -rf "$ROOT/dist"
          mkdir -p "$STAGE/icons"

          files=(
            manifest.json
            popup.html
            popup.css
            popup.js
            toggle-control.js
            review-sidebar-control.js
            version-sidebar-control.js
            version-comments-search.js
            version-vc-counters.js
            version-comment-location-pill.js
            content.js
            cms-dropdowns.js
            cms-code-editor.js
            cms-sequence-nav.js
            styles.css
            version-sidebar.css
            context-hide.css
            cms-editor-modal.css
            version-comments-export.js
            version-comments-export-links.js
          )

          for file in "${files[@]}"; do
            cp "$ROOT/$file" "$STAGE/$file"
          done

          # A Web Store atribui o seu próprio ID; a "key" só serve para a instalação sem compactação
          # e faz o upload falhar com PKG_MANIFEST_KEY_NOT_MATCH.
          python3 - "$STAGE/manifest.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          manifest = json.load(open(path, encoding="utf-8"))
          manifest.pop("key", None)
          json.dump(manifest, open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

          for icon in icon16.png icon32.png icon48.png icon128.png; do
            cp "$ROOT/icons/$icon" "$STAGE/icons/$icon"
            python3 - "$STAGE/icons/$icon" <<'PY'
          import struct, sys, zlib
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), sys.argv[1] + " is not a PNG"
          offset = 8
          while offset + 12 <= len(data):
              length, = struct.unpack(">I", data[offset:offset + 4])
              chunk_type = data[offset + 4:offset + 8]
              body = data[offset + 8:offset + 8 + length]
              crc, = struct.unpack(">I", data[offset + 8 + length:offset + 12 + length])
              assert zlib.crc32(chunk_type + body) & 0xFFFFFFFF == crc, sys.argv[1] + " has a corrupt chunk"
              offset += 12 + length
          PY
          done

          (cd "$STAGE" && zip -q -r "$ZIP" .)
          unzip -l "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload store package
        uses: actions/upload-artifact@v4
        with:
          name: gired-fixer-chrome-web-store
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: chrome-web-store
    concurrency:
      group: chrome-web-store-publish
      cancel-in-progress: false

    steps:
      - name: Download store package
        uses: actions/download-artifact@v4
        with:
          name: gired-fixer-chrome-web-store
          path: dist

      - name: Upload and publish to Chrome Web Store
        shell: bash
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          for name in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_EXTENSION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta o segredo $name (ver PUBLISHING.md)"
              exit 1
            fi
          done

          ZIP="$(ls dist/*.zip | head -n 1)"
          echo "A publicar $ZIP (v$VERSION) no item $CWS_EXTENSION_ID"

          TOKEN="$(curl -sS --fail-with-body --max-time 60 -X POST https://oauth2.googleapis.com/token             -d client_id="$CWS_CLIENT_ID"             -d client_secret="$CWS_CLIENT_SECRET"             -d refresh_token="$CWS_REFRESH_TOKEN"             -d grant_type=refresh_token | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"

          UPLOAD="$(curl -sS --fail-with-body --max-time 120 -X PUT             -H "Authorization: Bearer $TOKEN"             -H "x-goog-api-version: 2"             -T "$ZIP"             "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")"
          echo "Upload: $UPLOAD"
          echo "$UPLOAD" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if data.get("uploadState") not in ("SUCCESS", "IN_PROGRESS"):
              print("::error::Upload rejeitado: " + json.dumps(data.get("itemError", data)))
              sys.exit(1)
          '

          PUBLISH="$(curl -sS --fail-with-body --max-time 60 -X POST             -H "Authorization: Bearer $TOKEN"             -H "x-goog-api-version: 2"             -H "Content-Length: 0"             "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish")"
          echo "Publish: $PUBLISH"
          echo "$PUBLISH" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          status = data.get("status", [])
          if not any(s in ("OK", "ITEM_PENDING_REVIEW") for s in status):
              print("::error::Publicação falhou: " + json.dumps(data))
              sys.exit(1)
          print("Estado: " + ", ".join(status))
          '

          echo "### GiRED Fixer v$VERSION enviado para a Chrome Web Store" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Estado: \`$PUBLISH\`" >> "$GITHUB_STEP_SUMMARY"
