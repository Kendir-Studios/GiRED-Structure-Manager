<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiRED Structure Mapper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="popup">
        <div class="header">
            <div>
                <h1>GiRED Structure Mapper</h1>
                <p>Mapeamento SA / AT</p>
            </div>
            <span id="version" class="version"></span>
        </div>

        <div class="setting-row">
            <div class="setting-copy">
                <strong>Extensão</strong>
                <span id="statusText">Ativa</span>
            </div>

            <label class="switch" aria-label="Ligar ou desligar o GiRED Structure Mapper">
                <input id="enabledToggle" type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <p class="hint">A alteração é aplicada imediatamente às páginas GiRED abertas.</p>
    </main>

    <script src="popup.js"></script>
</body>
</html>
