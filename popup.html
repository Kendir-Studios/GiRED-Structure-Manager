<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiRED Fixer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="popup">
        <header class="header">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <span>SA</span>
                    <span>AT</span>
                </div>

                <div class="brand-copy">
                    <div class="title-row">
                        <h1>GiRED Fixer</h1>
                        <span id="version" class="version"></span>
                    </div>
                    <p>Mapeamento automático da estrutura</p>
                </div>
            </div>
        </header>

        <section class="card status-card" aria-label="Estado da extensão">
            <div class="setting-copy">
                <div class="eyebrow">Estado</div>
                <div class="status-line">
                    <span class="status-indicator" aria-hidden="true"></span>
                    <strong>Extensão</strong>
                </div>
                <span id="statusText">Ativa</span>
            </div>

            <label class="switch" aria-label="Ligar ou desligar o GiRED Fixer">
                <input id="enabledToggle" type="checkbox">
                <span class="slider"></span>
            </label>
        </section>

        <p class="hint">As alterações são aplicadas imediatamente às páginas GiRED abertas.</p>

        <section class="preferences" aria-labelledby="preferencesTitle">
            <div class="section-heading">
                <span id="preferencesTitle">Preferências</span>
            </div>

            <div class="card preference-card">
                <div class="setting-copy">
                    <strong>Só lista de correções</strong>
                    <span id="reviewCommentsStatus">Painel completo</span>
                </div>

                <label class="switch" aria-label="Mostrar apenas a lista de correções no painel de Revisão">
                    <input id="reviewCommentsToggle" type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="card preference-card">
                <div class="setting-copy">
                    <strong>Contadores A/B e C/D</strong>
                    <span id="vcCountersStatus">Ativados</span>
                </div>

                <label class="switch" aria-label="Substituir o contador nativo do Controlo de Versões pelos cartões A/B e C/D">
                    <input id="vcCountersToggle" type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <footer class="footer">
            <span>Kendir Studios</span>
            <span class="footer-dot">•</span>
            <span>Internal Tool</span>
        </footer>
    </main>

    <script src="popup.js"></script>
</body>
</html>
